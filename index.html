    <!--
      Fuente Outfit desde Google Fonts. `preconnect` abre la conexion
      antes de necesitarla y `display=swap` hace que el texto se vea con
      la fuente del sistema mientras carga, en lugar de dejar un hueco
      blanco. Si no hay red, la web se ve igual con la fuente de reserva.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
